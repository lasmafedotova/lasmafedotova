    <main>

        <!-- ============ HERO ============ -->
        <!--
            Scroll animation: the hero stays in place while you scroll,
            and the 12 frames change one after another (script.js, part 0).
            Phones get the smaller "-sm" files automatically.
            To change the speed, change the height of .hero in style.css.
        -->
        <section class="hero" id="hero">
            <div class="hero-sticky">
                <div class="hero-frames">
                    <img src="images/header-01.webp" srcset="images/header-01-sm.webp 960w, images/header-01.webp 1920w" sizes="100vw" width="1920" height="1080" alt="Lāsma sitting in front of large letters — a series of portraits in different styles" class="is-active">
                    <img src="images/header-02.webp" srcset="images/header-02-sm.webp 960w, images/header-02.webp 1920w" sizes="100vw" width="1920" height="1080" alt="">
                    <img src="images/header-03.webp" srcset="images/header-03-sm.webp 960w, images/header-03.webp 1920w" sizes="100vw" width="1920" height="1080" alt="">
                    <img src="images/header-04.webp" srcset="images/header-04-sm.webp 960w, images/header-04.webp 1920w" sizes="100vw" width="1920" height="1080" alt="">
                    <img src="images/header-05.webp" srcset="images/header-05-sm.webp 960w, images/header-05.webp 1920w" sizes="100vw" width="1920" height="1080" alt="">
                    <img src="images/header-06.webp" srcset="images/header-06-sm.webp 960w, images/header-06.webp 1920w" sizes="100vw" width="1920" height="1080" alt="">
                    <img src="images/header-07.webp" srcset="images/header-07-sm.webp 960w, images/header-07.webp 1920w" sizes="100vw" width="1920" height="1080" alt="">
                    <img src="images/header-08.webp" srcset="images/header-08-sm.webp 960w, images/header-08.webp 1920w" sizes="100vw" width="1920" height="1080" alt="">
                    <img src="images/header-09.webp" srcset="images/header-09-sm.webp 960w, images/header-09.webp 1920w" sizes="100vw" width="1920" height="1080" alt="">
                    <img src="images/header-10.webp" srcset="images/header-10-sm.webp 960w, images/header-10.webp 1920w" sizes="100vw" width="1920" height="1080" alt="">
                    <img src="images/header-11.webp" srcset="images/header-11-sm.webp 960w, images/header-11.webp 1920w" sizes="100vw" width="1920" height="1080" alt="">
                    <img src="images/header-12.webp" srcset="images/header-12-sm.webp 960w, images/header-12.webp 1920w" sizes="100vw" width="1920" height="1080" alt="">
                </div>
            </div>
        </section>

        <!-- ============ ABOUT ============ -->
        <section class="about" id="about">
            <div class="container">
                <h2 class="section-label">ABOUT</h2>
                <div class="about-grid">
                    <p class="about-hey">Hey!</p>
                    <p class="about-text">I’m a graphic designer/ artist <br class="br-desktop">based in Latvia.</p>
                </div>
            </div>
        </section>

        <!-- ============ WORKS ============ -->
        <section class="works container" id="works">
            <h2 class="section-label">WORKS</h2>

            <div class="tabs" role="tablist">
                <button class="tab is-active" role="tab" aria-selected="true" data-tab="personal">PERSONAL PROJECTS</button>
                <button class="tab" role="tab" aria-selected="false" data-tab="client">CLIENT WORK</button>
            </div>

            <!--
                HOW TO ADD A PROJECT:
                Copy one <article class="card"> … </article> block and change:
                  - data-title, data-year, data-description (shown in the pop-up)
                  - data-model (optional: path to a .glb file → shows the 3D viewer in the pop-up)
                  - class "card--dark" (black background) or "card--light" (white background)
                  - the <img> tags inside .slides (add more <img> lines for more slides)
                  - the caption text at the bottom
            -->

            <!-- PERSONAL PROJECTS -->
            <div class="gallery is-active" data-panel="personal">

                <article class="card card--dark"
                    data-title="Tool"
                    data-year="2025"
                    data-model="models/tool.glb"
                    data-description="A hybrid between the human body and an object of agricultural technology—berry-picking harvesters. This bodily-technical fusion creates the impression that the hand itself has become an instrument.&#10;Material – Plaster. Dimensions – 24 × 16,5 × 16 cm. 3D model created with RealityScan, edited with Blender.">
                    <div class="card-media">
                        <div class="slides">
                            <img src="images/tool-1.png" alt="Plaster hand sculpture">
                            <!-- <img src="images/tool-2.jpg" alt=""> -->
                        </div>
                    </div>
                    <div class="card-caption"><span>Tool</span><span>2025</span></div>
                </article>

                <article class="card card--light"
                    data-title="Latvian sayings"
                    data-year="2024"
                    data-description="">
                    <div class="card-media">
                        <div class="slides">
                            <img src="images/latvian-sayings-1.png" alt="Line drawing of a herring in a fur coat">
                        </div>
                    </div>
                    <div class="card-caption"><span>Latvian sayings</span><span>2024</span></div>
                </article>

                <article class="card card--dark"
                    data-title="Precipitation amount deviation"
                    data-year="2025"
                    data-description="">
                    <div class="card-media">
                        <div class="slides">
                            <img src="images/precipitation-1.png" alt="Turquoise data sculpture on black">
                        </div>
                    </div>
                    <div class="card-caption"><span>Precipitation amount deviation</span><span>2025</span></div>
                </article>

            </div>

            <!-- CLIENT WORK -->
            <div class="gallery" data-panel="client" hidden>

                <article class="card card--light"
                    data-title="Visual identity – Prokuratūrai 35"
                    data-year="2025"
                    data-description="">
                    <div class="card-media">
                        <div class="slides">
                            <img src="images/prokuraturai-35-1.png" alt="Visual identity for Prokuratūrai 35">
                        </div>
                    </div>
                    <div class="card-caption"><span>Visual identity – Prokuratūrai 35</span><span>2025</span></div>
                </article>

                <article class="card card--light"
                    data-title="Oversee social media"
                    data-year="2021"
                    data-description="">
                    <div class="card-media">
                        <div class="slides">
                            <img src="images/oversee-1.png" alt="Social media collage for Oversee">
                        </div>
                    </div>
                    <div class="card-caption"><span>Oversee social media</span><span>2021</span></div>
                </article>

            </div>
        </section>
    </main>

    <!-- ============ FOOTER ============ -->
    <footer class="site-footer">
        <label class="theme-toggle">
            <span>Black</span>
            <input type="checkbox" id="theme-switch">
            <span class="switch" aria-hidden="true"></span>
        </label>
        <p class="copyright">© 2026 Lāsma Fedotova</p>
    </footer>

    <!-- ============ PROJECT POP-UP ============ -->
    <dialog class="project-modal" id="project-modal" aria-labelledby="modal-title">
        <div class="modal-inner container">
            <div class="modal-top">
                <button class="round-btn modal-close" aria-label="Back">
                    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <h2 id="modal-title" class="modal-title"></h2>
            </div>
            <div class="modal-media"></div>
            <p class="modal-description"></p>
        </div>
    </dialog>

</body>
</html>
